name: CI

# Until now this repository ran its tests in exactly one situation: when a
# `v*` tag was pushed. That meant a broken test could only be discovered
# during a release — which is precisely what happened with v0.2.1. The test
# harness handed `subprocess` a hand-built environment; on Windows that
# strips `SYSTEMROOT`, the interpreter cannot reach the OS random source, and
# it dies before running anything. Green on macOS, red on the release runner,
# with a tag already pushed.
#
# Tests run on windows-latest because that is what we ship. The packaging
# tests start a real subprocess, and process startup is the single most
# platform-dependent thing this suite does. Ubuntu runs alongside as the
# cheap cross-check for anyone developing on Linux or macOS.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # ruff prueft, was ohne Laufzeit auffaellt: undefinierte Namen, ungenutzte
    # Importe, ungueltige Escapes, typische Fallen. In der Bridge zaehlt das
    # doppelt, weil ein Fehler in einem selten genutzten Pfad sonst erst beim
    # Kunden auftaucht und ein neues Release kostet. Ein Lauf auf Ubuntu
    # reicht: das Ergebnis haengt nicht vom Betriebssystem ab.
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Version wie in pyproject.toml [dev] — lokal und CI sehen dieselben Regeln.
      - name: Install ruff
        run: python -m pip install ruff==0.16.9

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check --diff .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Pillow ist keine Laufzeit-Abhaengigkeit — die Bridge braucht es
          # nicht, und `assets/icon.ico` liegt fertig im Repo. Es steht hier
          # fuer EINE Zusicherung: den Abgleich, dass das ICO noch dem
          # Marken-Glyph aus `cockpit/assets.py` entspricht. Ohne Pillow
          # ueberspringt dieser Test sich selbst, und ein Abgleich, der nur
          # auf Maschinen laeuft, die ihn zufaellig ausfuehren koennen, ist
          # keiner — dieselbe Stille, die das Python-Symbol ausgeliefert hat.
          pip install -r requirements.txt pytest Pillow

      - name: Run tests
        run: pytest -q
