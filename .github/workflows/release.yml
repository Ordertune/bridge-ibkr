name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    # Auf **Job**-Ebene, nicht am Schritt. Darin lag T1-182 B.
    #
    # Der Signierschritt trug bisher `if: env.CERT_PFX_BASE64 != ''` und
    # definierte `CERT_PFX_BASE64` im `env:`-Block desselben Schrittes. Ein
    # `if:` sieht die `env:` seines eigenen Schrittes aber nicht — nur die von
    # Job und Workflow. Die Bedingung verglich also immer Leer gegen Leer, war
    # immer falsch, und der Schritt ist **kein einziges Mal gelaufen**.
    #
    # Das war nicht daran zu merken, dass etwas fehlschlug: ein
    # uebersprungener Schritt ist in der Oberflaeche grau, nicht rot, und der
    # Release war gruen. Deshalb steht die Ableitung hier oben, wo `if:` sie
    # lesen kann.
    env:
      SIGNIERUNG_KONFIGURIERT: ${{ secrets.SSLCOM_USERNAME != '' }}
      UNSIGNIERT_ERLAUBT: ${{ vars.ALLOW_UNSIGNED_RELEASE == 'true' }}

      # Der Name, auf den das Zertifikat lautet — und damit der Name, den
      # Windows im Startdialog anzeigt.
      #
      # Steht hier im Klartext und nicht in einem Geheimnis: er ist per
      # Konstruktion oeffentlich (er steckt in jeder ausgelieferten EXE und im
      # Handelsregister), und als Geheimnis waere er in den Protokollen
      # maskiert — ausgerechnet in der Meldung, die erklaeren soll, welcher
      # Name erwartet wurde.
      #
      # Order Dynamics GmbH, Geschwister-Scholl-Str. 109, 20251 Hamburg,
      # HRB 200459. Abgeglichen wird gegen den Zertifikats-Subject, der die
      # Form `CN=..., O=..., L=Hamburg, C=DE` hat — deshalb Teilstring und
      # nicht Gleichheit.
      ERWARTETER_HERAUSGEBER: "Order Dynamics GmbH"

    steps:
      - uses: actions/checkout@v4

      # Vor dem Bauen, nicht danach — ein Release, der am letzten Schritt
      # scheitert, hat zehn Minuten Rechenzeit fuer nichts verbraucht.
      - name: Ein Tag-Release ohne Signierung ist eine Entscheidung, kein Versehen
        if: >-
          startsWith(github.ref, 'refs/tags/v')
          && env.SIGNIERUNG_KONFIGURIERT != 'true'
          && env.UNSIGNIERT_ERLAUBT != 'true'
        shell: pwsh
        run: |
          Write-Host "::error title=Unsignierter Release::Es fehlen die Signier-Zugangsdaten."
          Write-Host @"

          Dieser Tag wuerde eine unsignierte EXE veroeffentlichen. Windows meldet
          darauf „Unknown publisher", und der Kunde wird gefragt, ob er das
          Programm trotzdem starten will — neben seinem Depot.

          Bis 0.23.2 ist das stillschweigend passiert, weil der Signierschritt
          eine Bedingung hatte, die nie zutraf. Ab T1-182 ist es eine Ansage.

          Zwei Wege weiter:

            1. Zertifikat einrichten. Die vier Geheimnisse setzen:
                 SSLCOM_USERNAME, SSLCOM_PASSWORD,
                 SSLCOM_CREDENTIAL_ID, SSLCOM_TOTP_SECRET
               Beschaffung und Einrichtung: docs/CODE_SIGNING.md

            2. Bewusst unsigniert ausliefern. Repository-Variable setzen:
                 ALLOW_UNSIGNED_RELEASE = true
               Damit laeuft dieser Release durch und die Release-Notiz sagt
               offen, dass die Datei unsigniert ist.

          "@
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # `|| echo "no tests yet"` stood here and swallowed every failure — a
      # red suite still cut a release. The contract tests are the only thing
      # standing between a format change and a Bridge that cannot talk to the
      # API, so they have to be able to stop the build.
      - name: Run tests
        run: |
          # Pillow: siehe ci.yml — traegt den Abgleich zwischen `icon.ico` und
          # dem Marken-Glyph. Ohne es ueberspringt der Test sich selbst.
          pip install pytest Pillow
          pytest -q

      - name: Build EXE
        run: python build.py

      # Start the artifact we are about to publish.
      #
      # v0.1.0 and v0.2.0 both shipped an executable that died on its first
      # import, because PyInstaller was pointed at a module inside the package.
      # Every test passed: they import the package the normal way, where
      # relative imports work. Nothing ever launched the built EXE.
      #
      # With no bridge.env present the Bridge is expected to reject its
      # configuration and exit 1. That is the success condition here — it
      # proves the program got past its imports and into its own error
      # handling. An ImportError or a bare traceback means we would be
      # publishing a binary that cannot start.
      # T1-213, 2026-09-23 — dieser Schritt musste umgebaut werden, und das war
      # der gefaehrlichste Teil des ganzen Vorgangs.
      #
      # Bis dahin las er die STANDARDAUSGABE der gestarteten EXE und suchte
      # darin nach `ImportError`, `Traceback` und der Kennung `env_missing`.
      # Die EXE wird seit T1-213 fensterlos gebaut und schreibt nichts mehr
      # dorthin. `$out` waere leer gewesen — und eine Suche in einer leeren
      # Zeichenkette findet nie etwas. Der Schritt, der jeden Startfehler seit
      # 0.1.0 gefunden hat, waere still gruen geblieben.
      #
      # Geprueft wird jetzt an zwei Dingen, die es weiterhin gibt:
      #
      #   1. dem Ausgangscode,
      #   2. der PROTOKOLLDATEI, die der Lauf hinterlaesst.
      #
      # Die Datei wird in jedem Fall geschrieben (`logging_setup`, 30 Tage
      # Vorhaltung) und liegt unter dem Nutzerprofil (T1-176 B). Sie ist der
      # einzige Ort, an dem eine fensterlose Anwendung noch spricht.
      #
      # `--headless` ist neu und Pflicht: seit T1-213 haengt der
      # Erst-Start-Assistent nicht mehr an einer interaktiven Konsole, sondern
      # allein an dieser Zusage. Ohne sie ginge hier ein Cockpit auf, auf das
      # niemand wartet — genau der Hang, den dieser Schritt schon zweimal
      # gefunden hat.
      - name: Smoke-test the built EXE
        shell: pwsh
        run: |
          $probe = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "bridge-smoke") -Force
          $exe = Join-Path $PWD "dist\ordertune-bridge-ibkr.exe"
          $logDir = Join-Path $env:LOCALAPPDATA "Ordertune\Bridge\logs"
          if (Test-Path $logDir) { Remove-Item -Recurse -Force $logDir }

          Push-Location $probe
          $out = & $exe --headless 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location

          Write-Host "--- exit code: $code ---"
          Write-Host "--- stdout (expected to be empty for a windowed build) ---"
          Write-Host $out

          $logFile = Join-Path $logDir "bridge.log"
          if (-not (Test-Path $logFile)) {
            Write-Error "The EXE left no log file at $logFile. A run that leaves nothing behind is not a passed run — and with no console, the log is the only thing that still speaks."
            exit 1
          }
          $log = Get-Content $logFile -Raw
          if ([string]::IsNullOrWhiteSpace($log)) {
            Write-Error "The log file at $logFile is empty. Same verdict as a missing one."
            exit 1
          }
          Write-Host "--- log file ---"
          Write-Host $log

          # T1-213: dieselbe Datei zum Mitnehmen. Sie liegt unter dem
          # Nutzerprofil (T1-176 B) und damit ausserhalb des Arbeitsbereichs;
          # ohne diese Kopie waere sie nach dem Lauf fort. Bei einem ROTEN
          # Lauf ist sie das Einzige, woran sich die Ursache ablesen laesst —
          # eine fensterlose Anwendung sagt sonst nichts.
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\smoke" -Force | Out-Null
          Copy-Item $logFile "$env:GITHUB_WORKSPACE\smoke\bridge.log" -Force

          # Dieselben drei Fragen wie vorher, nur an der Quelle, die es noch
          # gibt. `$out` wird mitgeprueft: in einem Build, der doch wieder eine
          # Konsole bekommt, steht der Traceback dort, und dann soll er auch
          # dort gefunden werden.
          $beides = "$out`n$log"
          if ($beides -match "ImportError" -or $beides -match "Traceback \(most recent call last\)") {
            Write-Error "The built EXE fails to start. Publishing this would ship a binary that dies on launch."
            exit 1
          }
          # T1-101 A-2: geprueft wird die stabile Kennung, nicht der Wortlaut.
          if ($beides -notmatch "env_missing") {
            Write-Error "Expected the configuration check to run and reject the missing bridge.env. It did not — the startup path changed."
            exit 1
          }
          # T1-213 C-3: unter --headless geht der Assistent NICHT auf.
          if ($beides -match "A setup window has opened") {
            Write-Error "The packed EXE opened the setup assistant with nobody there. It waits forever — that is a hang, not a prompt."
            exit 1
          }
          if ($code -ne 1) {
            Write-Error "Expected exit code 1 from a missing configuration, got $code."
            exit 1
          }
          Write-Host "EXE starts, reaches its configuration check, writes its log, and exits cleanly."

          # `exit 0` is required, not decoration. GitHub appends
          # `exit $LASTEXITCODE` to every pwsh step, and $LASTEXITCODE is still
          # 1 here — from the Bridge, which is SUPPOSED to exit 1 on a missing
          # bridge.env. Without this line the step inherits that 1 and fails
          # after all three checks passed, which is how the first green run of
          # this guard was reported as a failure.
          exit 0

      # Cloud-HSM statt `.pfx`-Datei.
      #
      # Hier stand ein `signtool sign /f cert.pfx /p <Passwort>`. Dieser Weg
      # ist nicht bloss ungenutzt gewesen, er ist **nicht mehr gangbar**: seit
      # dem 01.06.2023 verlangt das CA/Browser-Forum, dass der private
      # Schluessel eines Code-Signing-Zertifikats auf Hardware nach FIPS 140-2
      # Level 2 bzw. EAL4+ liegt. Seitdem gibt keine Zertifizierungsstelle mehr
      # eine `.pfx`-Datei heraus. Ein Geheimnis namens CERT_PFX_BASE64 haette
      # also nie befuellt werden koennen — der Schritt wartete auf etwas, das
      # es nicht zu kaufen gibt.
      #
      # Der Schluessel liegt jetzt beim Dienstleister im HSM und verlaesst ihn
      # nicht. Die Aktion schickt den Hashwert hin und bekommt die Signatur
      # zurueck. Auf SHA gepinnt, nicht auf `@develop` wie in der Anleitung des
      # Anbieters: ein Tag laesst sich verschieben, und diese Aktion bekommt
      # unsere Signierrechte zu sehen.
      - name: Sign EXE
        if: env.SIGNIERUNG_KONFIGURIERT == 'true'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: ${{ github.workspace }}\dist\ordertune-bridge-ibkr.exe
          override: true

      # Dass der Signierschritt gruen war, belegt die Signatur nicht.
      #
      # Das ist dieselbe Lehre wie beim Symbol: `--icon` mitzugeben hiess
      # nicht, dass es ankam, und ein durchgelaufener Signierschritt heisst
      # nicht, dass die Datei jetzt eine gueltige Kette hat. Hier wird die
      # ausgelieferte Datei gelesen.
      - name: Signatur belegen
        if: env.SIGNIERUNG_KONFIGURIERT == 'true'
        shell: pwsh
        run: |
          $exe = "dist\ordertune-bridge-ibkr.exe"

          # `Get-AuthenticodeSignature` statt der Textausgabe von signtool.
          # Herausgeber und Zeitstempel kommen hier als Objekte; ein
          # `-match "Timestamp"` auf eine Textausgabe haengt dagegen an
          # Formulierung und Sprache des Werkzeugs.
          $sig = Get-AuthenticodeSignature $exe

          if ($sig.Status -ne 'Valid') {
            Write-Error "Signaturzustand ist '$($sig.Status)', nicht 'Valid'. $($sig.StatusMessage)"
            exit 1
          }

          # Der Zeitstempel ist der Teil, der die Signatur ueberlebt: ohne ihn
          # wird die Datei ungueltig, sobald das Zertifikat ablaeuft — also
          # mitten im Leben einer ausgelieferten Fassung.
          if (-not $sig.TimeStamperCertificate) {
            Write-Error "Signatur ohne Zeitstempel. Sie wird mit dem Zertifikat ungueltig statt zu bestehen."
            exit 1
          }

          # Auf WELCHEN Namen signiert wurde, ist nicht kosmetisch: genau
          # dieser Name steht kuenftig in Windows' Startdialog, und an ihm
          # haengt der Reputationsaufbau. Ein Zertifikat, das versehentlich auf
          # eine andere Identitaet lautet — falscher `credential_id`, zweites
          # Zertifikat im Konto, Wechsel beim Verlaengern —, wuerde sonst still
          # ausgeliefert und der aufgebaute Ruf begaenne von vorn.
          $subject = $sig.SignerCertificate.Subject
          if ($subject -notmatch [regex]::Escape($env:ERWARTETER_HERAUSGEBER)) {
            Write-Error @"
          Signiert auf den falschen Herausgeber.

            erwartet : $($env:ERWARTETER_HERAUSGEBER)
            gefunden : $subject

          Stimmt der neue Name absichtlich nicht mehr, ist ERWARTETER_HERAUSGEBER
          in dieser Datei nachzuziehen — und zu bedenken, dass die SmartScreen-
          Reputation am Zertifikat haengt und mit dem Wechsel bei null beginnt.
          "@
            exit 1
          }

          # Gegenprobe mit signtool: /pa ist die Richtlinie, nach der Windows
          # beim Doppelklick prueft. Ohne /pa wird gegen eine andere Kette
          # geprueft, und das meldet Erfolg, wo der Explorer spaeter meckert.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
                     | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool lehnt die Signatur unter der Windows-Richtlinie ab."
            exit 1
          }

          Write-Host "Signatur belegt: $subject, mit Zeitstempel."
          exit 0

      - name: Package release zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.txt

          # `github.ref_name` wanderte bisher ungefiltert in den Dateinamen.
          # Bei einem Tag geht das gut (`v0.23.3`), bei einem Branch nicht:
          # jeder Branchname hier traegt einen Schraegstrich (`feat/…`,
          # `fix/…`), und daraus wird ein Unterverzeichnis, das es nicht gibt
          # — `Compress-Archive` bricht ab. Damit war der `workflow_dispatch`,
          # den diese Datei ausdruecklich anbietet, auf keinem Branch je
          # benutzbar.
          #
          # Aufgefallen beim Probelauf zu T1-182, der genau dafuer da war: den
          # Build einmal durchspielen, ohne einen Tag zu setzen. Genau das
          # wird gebraucht, wenn die Signierung erstmals erprobt wird.
          #
          # Tags bleiben unveraendert — `v0.23.3` enthaelt kein Zeichen, das
          # die Ersetzung anfasst.
          $name = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          Compress-Archive -Path dist/ordertune-bridge-ibkr.exe,dist/README.txt `
            -DestinationPath "dist/ordertune-bridge-ibkr-$name.zip"

      # T1-213 — die gebaute Datei zum Mitnehmen, ohne sie zu veroeffentlichen.
      #
      # ## Warum es das braucht
      #
      # Bis hierher verliess die EXE diese Werkstatt auf genau einem Weg: dem
      # Release-Schritt, und der haengt an `refs/tags/v*`. Wer sie nur
      # ausprobieren wollte, musste also eine Fassung veroeffentlichen — und
      # damit genau den Schritt tun, den ein Probelauf vermeiden soll.
      #
      # Der `workflow_dispatch`, den diese Datei ausdruecklich anbietet, baute
      # die EXE und warf sie anschliessend weg.
      #
      # ## `always()`, und das ist der Punkt
      #
      # Gebraucht wird das Artefakt am dringendsten, wenn der Lauf ROT ist:
      # der Smoke-Test steht vor dem Signieren, ein Fehlschlag ueberspringt
      # alles Weitere, und ohne diese Bedingung gaebe es dann gar nichts zum
      # Nachsehen. `if-no-files-found: warn` faengt den Fall, in dem schon der
      # Build gescheitert ist und es wirklich nichts gibt.
      #
      # Kurze Vorhaltung: das hier ist ein Probeergebnis, keine Auslieferung.
      # Was ausgeliefert wird, haengt weiterhin am Tag.
      - name: Artefakt zum Mitnehmen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/ordertune-bridge-ibkr.exe
            dist/*.zip
            smoke/bridge.log

      # Eine unsignierte Datei muss sich als solche zu erkennen geben.
      #
      # Wer die Seite oeffnet, soll nicht raten muessen, ob die Warnung beim
      # Start erwartbar ist oder auf etwas Manipuliertes hindeutet. Genau diese
      # Ununterscheidbarkeit ist der Grund, warum „Unknown publisher" mehr
      # kaputt macht als es aussieht.
      - name: Hinweis fuer die Release-Notiz
        id: hinweis
        shell: pwsh
        run: |
          if ($env:SIGNIERUNG_KONFIGURIERT -eq 'true') {
            $text = "Signiert. Windows zeigt den Herausgeber im Startdialog an."
          } else {
            $text = @"
          > **Diese Datei ist nicht signiert.**
          > Windows meldet beim Start ``Unknown publisher`` und fragt nach, ob das
          > Programm trotzdem laufen soll. Das ist bei dieser Fassung erwartbar und
          > kein Hinweis auf eine veraenderte Datei. Pruefen laesst sich das ueber
          > die SHA-256-Summe unten.
          "@
          }
          $summe = (Get-FileHash dist\ordertune-bridge-ibkr.exe -Algorithm SHA256).Hash
          $block = "$text`n`n``SHA-256: $summe``"
          # Mehrzeilig ueber ein Begrenzerzeichen, sonst schluckt die Ausgabe
          # alles ab der zweiten Zeile.
          "notiz<<ENDE`n$block`nENDE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/ordertune-bridge-ibkr.exe
            dist/ordertune-bridge-ibkr-${{ github.ref_name }}.zip
          # `body` wird den erzeugten Notizen VORANgestellt — der Hinweis steht
          # also oben, nicht unter der Liste der Aenderungen. Bewusst ohne
          # `append_body`: das haengt an eine bestehende Notiz an, und ein
          # zweiter Lauf auf denselben Tag hinterliesse den Hinweis doppelt.
          generate_release_notes: true
          body: ${{ steps.hinweis.outputs.notiz }}
