name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # `|| echo "no tests yet"` stood here and swallowed every failure — a
      # red suite still cut a release. The contract tests are the only thing
      # standing between a format change and a Bridge that cannot talk to the
      # API, so they have to be able to stop the build.
      - name: Run tests
        run: |
          pip install pytest
          pytest -q

      - name: Build EXE
        run: python build.py

      # Start the artifact we are about to publish.
      #
      # v0.1.0 and v0.2.0 both shipped an executable that died on its first
      # import, because PyInstaller was pointed at a module inside the package.
      # Every test passed: they import the package the normal way, where
      # relative imports work. Nothing ever launched the built EXE.
      #
      # With no bridge.env present the Bridge is expected to reject its
      # configuration and exit 1. That is the success condition here — it
      # proves the program got past its imports and into its own error
      # handling. An ImportError or a bare traceback means we would be
      # publishing a binary that cannot start.
      - name: Smoke-test the built EXE
        shell: pwsh
        run: |
          $probe = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "bridge-smoke") -Force
          $exe = Join-Path $PWD "dist\ordertune-bridge-ibkr.exe"
          Push-Location $probe
          $out = & $exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location

          Write-Host "--- exit code: $code ---"
          Write-Host $out

          if ($out -match "ImportError" -or $out -match "Traceback \(most recent call last\)") {
            Write-Error "The built EXE fails to start. Publishing this would ship a binary that dies on launch."
            exit 1
          }
          if ($out -notmatch "bridge.env invalid") {
            Write-Error "Expected the configuration check to run and reject the missing bridge.env. It did not — the startup path changed."
            exit 1
          }
          if ($code -ne 1) {
            Write-Error "Expected exit code 1 from a missing configuration, got $code."
            exit 1
          }
          Write-Host "EXE starts, reaches its configuration check, and exits cleanly."

          # `exit 0` is required, not decoration. GitHub appends
          # `exit $LASTEXITCODE` to every pwsh step, and $LASTEXITCODE is still
          # 1 here — from the Bridge, which is SUPPOSED to exit 1 on a missing
          # bridge.env. Without this line the step inherits that 1 and fails
          # after all three checks passed, which is how the first green run of
          # this guard was reported as a failure.
          exit 0

      - name: Sign EXE (if cert available)
        if: env.CERT_PFX_BASE64 != ''
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PW: ${{ secrets.CERT_PW }}
        shell: pwsh
        run: |
          [System.Convert]::FromBase64String($env:CERT_PFX_BASE64) | Set-Content cert.pfx -Encoding Byte
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" `
                     | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PW `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            dist/ordertune-bridge-ibkr.exe

      - name: Package release zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/ordertune-bridge-ibkr.exe,dist/README.txt `
            -DestinationPath dist/ordertune-bridge-ibkr-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/ordertune-bridge-ibkr.exe
            dist/ordertune-bridge-ibkr-${{ github.ref_name }}.zip
          generate_release_notes: true
