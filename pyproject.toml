[project]
name = "ordertune-bridge-ibkr"
version = "0.10.0"
description = "Ordertune Bridge — Windows-Native Client für IBKR TWS/Gateway. Holt confirmed Signale aus t1.ordertune.com, führt Orders auf privatem IBKR-Depot aus, meldet Depot-State und Order-Results zurück."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jan Christoph Drechsel", email = "helpdesk@ordertune.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ib_insync>=0.9.86",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "coloredlogs>=15.0.1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ordertune-bridge-ibkr = "ordertune_bridge_ibkr.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
