[project]
name = "ordertune-bridge-ibkr"
version = "0.35.1"
description = "Ordertune Bridge — Client für IBKR TWS auf Windows und Linux. Holt confirmed Signale aus t1.ordertune.com, führt Orders auf privatem IBKR-Depot aus, meldet Depot-State und Order-Results zurück."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jan Christoph Drechsel", email = "helpdesk@ordertune.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ib_insync>=0.9.86",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "coloredlogs>=15.0.1",
    # T1-206 Entscheidung 6 — ohne Plattform-Einschraenkung.
    #
    # Hier stand `; sys_platform == 'win32'`, weil Linux die Zonendaten aus
    # dem System nimmt. Das stimmt — auf einem schlanken VPS-Abbild fehlen sie
    # aber, und dann endete die Bridge an einer Meldung ueber eine fehlende
    # Zeitzone. Die Alternative waere, dem Kunden ein Systempaket in die
    # Anleitung zu schreiben: ein Handgriff mehr in einer Anleitung, die schon
    # lang ist, fuer eine Fehlerklasse, die ein paar hundert Kilobyte
    # beseitigen. Python nimmt die Systemdaten, wenn sie da sind, und faellt
    # sonst hierauf zurueck — auf allen drei zugesagten Systemen aendert das
    # nichts.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
    # Exakt gepinnt: CI und lokale Pruefung muessen dieselben Regeln sehen.
    # Neue ruff-Versionen bringen neue Befunde; Anheben ist ein eigener PR.
    "ruff==0.16.9",
    # Nur fuer `tools/make_icon.py` und den Abgleich des Symbols gegen das
    # Design-System. Der Build selbst braucht es nicht — `assets/icon.ico`
    # liegt fertig im Repo.
    "Pillow>=10.0.0",
]

[project.scripts]
ordertune-bridge-ibkr = "ordertune_bridge_ibkr.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ausdruecklich gewaehlt statt ruffs Voreinstellung, die sich zwischen
# Versionen aendert. Fehlerklassen, die zur Laufzeit beissen (F: undefinierte
# Namen, ungenutzte Importe; E4/E7/E9: Syntax und Importe; W: ungueltige
# Escapes; B: typische Fallen wie zip ohne strict), dazu sortierte Importe (I)
# und zeitgemaesse Schreibweisen fuer Python 3.10 (UP).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
# E402: Importe mitten in der Datei sind hier Absicht. Sie stehen direkt unter
# der Begruendung, warum der Name weiter aus diesem Modul kommt
# (Weiterverwendung durch Importeure, siehe main.py, order_reconcile.py).
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
